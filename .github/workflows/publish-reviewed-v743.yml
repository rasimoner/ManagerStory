name: Publish reviewed V7.4.3 checkpoint
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: reviewed-v743-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require the exact reviewed product
        env:
          REVIEWED_COMMIT: e17e887d303af6e275af7b8ebfcc2c5885d7f058
        run: |
          test "$(git rev-parse HEAD:dist)" = "$(git rev-parse "$REVIEWED_COMMIT:dist")"
          node -e 'if (require("./package.json").version !== "7.4.3") process.exit(1)'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image test dependency
        run: python -m pip install Pillow==11.3.0
      - name: Validate current application and actual model contacts
        run: node --test tests/managerstory.test.cjs tests/match3d-carry-facing.test.cjs tests/match3d-gait-continuity.test.cjs tests/match3d-approved-player.test.cjs
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
