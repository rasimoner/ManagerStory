name: Publish ManagerStory
# test the sources → build → smoke-test the build in a browser → publish the build to GitHub Pages (refactor E6)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image test dependency
        run: python -m pip install Pillow==11.3.0
      - name: Install
        run: npm ci
      - name: Test game
        run: npm test
      - name: Build
        run: npm run build
      - name: Install browser for the smoke test
        run: npx playwright install --with-deps chromium
      - name: Smoke test the build
        run: npm run smoke
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
