name: Verify match simulation
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths-ignore: ['docs/**', 'README.md']
permissions:
  contents: read
concurrency:
  group: match-sim-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    needs: simulation-3d-mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: npm ci
      - run: npm run lint
      - run: npm run test:fast
        env:
          DURATION_CLOCK_METRICS: duration-clocks.json
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify legacy and mobile laboratory smoke tests
        run: npm run smoke
        env:
          SHOOTING_SCREENSHOT: shooting-mobile.png
          BALANCE_SCREENSHOT: balance-mobile.png
          CAREER_CONTROLS_ONLY: '1'
      - name: Measure fifty matches and attribute-strength experiments
        # Short-flow and 3D tasks exclude new balance/duration sweeps; retain every test and smoke gate.
        if: github.head_ref != 'feat/short-match-flow' && github.head_ref != 'feat/match-sim-3d'
        run: |
          npm run sim:report -- --strength --output balance-measurements.json
          node tools/sim-report/compare.cjs docs/measurements/match-sim-balance-after.json balance-measurements.json
      - name: Measure all five durations with the same fifty equal-squad seeds
        if: github.head_ref != 'feat/short-match-flow' && github.head_ref != 'feat/match-sim-3d'
        run: npm run sim:duration-report -- duration-measurements.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: match-sim-verification
          path: |
            balance-measurements.json
            duration-measurements.json
            duration-clocks.json
            balance-mobile.png
            shooting-mobile.png
          if-no-files-found: ignore
  continuous-mobile:
    # The 3D task uses the bounded real-WebGL smoke scenarios instead of another seven-minute watch.
    if: github.event.pull_request.draft == false && github.head_ref != 'feat/short-match-flow' && github.head_ref != 'feat/match-sim-3d'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Watch a complete natural seven-minute 1x career match on a mobile viewport
        run: node --experimental-vm-modules --disable-warning=ExperimentalWarning tests/smoke/career-sim.mjs
        env:
          CAREER_SCREENSHOT: career-mobile.png
          CAREER_METRICS: career-mobile-metrics.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: continuous-career-mobile
          path: |
            career-mobile.png
            career-mobile-metrics.json
          if-no-files-found: ignore

  simulation-3d-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Inspect actual 3D frames and controls at 390 by 844
        run: npm run smoke:sim-3d
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulation-3d-mobile
          path: test-results/sim-3d/
          if-no-files-found: ignore
